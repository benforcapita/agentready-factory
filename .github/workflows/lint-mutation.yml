name: Lint mutation

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show checked-out revision
        run: |
          echo "checked out (merge ref): $(git rev-parse HEAD)"
          echo "pull request head: ${{ github.event.pull_request.head.sha }}"
          echo "base: ${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-liberation2
      - run: python -m pip install .
      - name: Check mutations offline
        shell: bash
        run: |
          report="$RUNNER_TEMP/lint-mutation.json"
          set +e
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v python)" tools/lint-mutation/run.py --seed 567 --budget-seconds 150 > "$report"
          status=$?
          set -e
          cat "$report"
          if ! python -c 'import json, sys; json.load(open(sys.argv[1]))' "$report" 2>/dev/null; then
            printf '{"crash": "run.py exited %s without a JSON report", "exit_code": %s, "errors": ["crash"]}\n' \
              "$status" "$status" > "$report"
            echo "::error::lint-mutation produced no valid report (exit $status); uploaded a crash stub"
            [ "$status" -ne 0 ] || status=1
          fi
          exit "$status"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-mutation
          path: ${{ runner.temp }}/lint-mutation.json
          if-no-files-found: error

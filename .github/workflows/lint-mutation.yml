name: Lint mutation

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-liberation2
      - run: python -m pip install .
      - name: Check mutations offline
        shell: bash
        run: |
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v python)" tools/lint-mutation/run.py --seed 567 --budget-seconds 90 \
            | tee "$RUNNER_TEMP/lint-mutation.json"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-mutation
          path: ${{ runner.temp }}/lint-mutation.json
          if-no-files-found: ignore

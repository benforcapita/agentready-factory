name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core fonts-liberation2
      - run: python -m pip install .
      - run: python -m unittest discover -v
      - name: Render Lehamim golden and check HTML/PDF
        run: |
          python -m arf.render fixtures/golden/lehamim/report.md --out out/golden \
            --title "דוח AgentReady — מאפיית לחמים" --final
          diff -u fixtures/golden/lehamim/report.html out/golden/report.html
          echo "golden HTML: identical to fixtures/golden/lehamim/report.html"
          python -m arf.render fixtures/golden/lehamim/report.md --out out/shadow --run-id ci-shadow
          grep -q "<!-- arf:draft run=ci-shadow -->" out/shadow/report.html
          for pdf in out/golden/report.pdf out/shadow/report.pdf; do
            echo "== $pdf"
            pdfinfo "$pdf"
            pdffonts "$pdf"
            pdfinfo "$pdf" | grep -qE 'Page size:.*\(A4\)'
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/{print $2}')
            if [ "$pages" -lt 2 ] || [ "$pages" -gt 4 ]; then echo "expected 2-4 pages, got $pages"; exit 1; fi
            if pdffonts "$pdf" | tail -n +3 | awk '{print $(NF-4)}' | grep -qv '^yes$'; then echo "font not embedded"; exit 1; fi
            pdftotext "$pdf" - | grep -q "תקציר מנהלים"
          done
          pdftotext out/shadow/report.pdf - | grep -q "לא לשליחה"
          if pdftotext out/golden/report.pdf - | grep -q "DRAFT"; then echo "marker present with --final"; exit 1; fi
          echo "PDF checks passed"
      - name: Replay Lehamim bundle offline (no network namespace)
        run: |
          offline() { sudo unshare --net -- "$@"; }
          if offline "$(command -v python)" -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=3)" 2>/dev/null; then
            echo "network reachable inside the offline namespace"; exit 1
          fi
          for mode in shadow final; do
            flag=""; [ "$mode" = final ] && flag="--final"
            offline "$(command -v arf)" replay fixtures/golden/lehamim --out "out/replay/$mode" \
              --prompts fixtures/prompts/recorded --ack fixtures/lint/lehamim/lint-ack.json --run-id ci-replay $flag
            pages=$(pdfinfo "out/replay/$mode/report.pdf" | awk '/^Pages:/{print $2}')
            if [ "$pages" -lt 2 ] || [ "$pages" -gt 4 ]; then echo "expected 2-4 pages, got $pages"; exit 1; fi
            python -c "import json, sys; r = json.load(open(sys.argv[1])); print(json.dumps(r['checks'])); sys.exit(not r['passed'])" \
              "out/replay/$mode/replay.json"
          done
          diff -u fixtures/golden/lehamim/report.html out/replay/final/report.html
      - name: Orchestrator dry run (T8a)
        run: |
          python -m arf.orchestrator dry-run fixtures/requests/sample.yaml --out "$RUNNER_TEMP/arf-dry-run" --duplicate
          if python -m arf.orchestrator dry-run fixtures/requests/sample.yaml --out "$RUNNER_TEMP/arf-blocked" --force-lint-failure; then
            echo "forced lint failure did not block"; exit 1
          fi
      - name: Publish dry run (T8b)
        run: |
          python -m arf.publish dry-run fixtures/requests/sample.yaml --out "$RUNNER_TEMP/arf-publish" | tee "$RUNNER_TEMP/publish.txt"
          grep -q "Needs review; run run-0001 succeeded; artifacts 8; command center 1" "$RUNNER_TEMP/publish.txt"
          grep -qF "Nothing sent; nobody contacted." "$RUNNER_TEMP/arf-publish/run-0001/result-comment.md"
          python -m arf.publish dry-run fixtures/requests/sample.yaml --out "$RUNNER_TEMP/arf-publish-eval" --eval | grep -q "command center 0"
          if grep -rniE "permission|shar(e|ing)|anyone|domain.?wide|transfer|owner|notify|send|mail" src/arf/publish; then
            echo "sharing/permission/send API in publish code"; exit 1
          fi
      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lehamim-replay
          path: out/replay/
          if-no-files-found: ignore

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentready-factory"
version = "0.1.0"
description = "AgentReady report factory command-line tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic~=2.12.5", "PyYAML~=6.0.3"]

[project.scripts]
arf = "arf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
